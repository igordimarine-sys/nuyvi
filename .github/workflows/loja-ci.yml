name: loja-ci

on:
  push:
    paths: ["loja/**", ".github/workflows/loja-ci.yml"]
  pull_request:
    paths: ["loja/**", ".github/workflows/loja-ci.yml"]

permissions:
  contents: read

concurrency:
  group: loja-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: loja
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loja/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
