name: loja-ci

on:
  push:
    paths: ["loja/**", ".github/workflows/loja-ci.yml"]
  pull_request:
    paths: ["loja/**", ".github/workflows/loja-ci.yml"]

permissions:
  contents: read

concurrency:
  group: loja-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valores fictícios só para o build validar env.ts; não são segredos nem apontam para banco real.
    # O build não conecta ao banco (pg.Pool é preguiçoso). Segredos reais ficam só na Vercel.
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-nao-e-segredo-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      # Testes de integração: o global-setup cria o database loja_test no service abaixo.
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/loja_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # fictício, só no runner efêmero
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: loja
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loja/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
