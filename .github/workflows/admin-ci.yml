name: admin-ci

on:
  push:
    paths: ["admin/**", "site/**", ".github/workflows/admin-ci.yml"]
  pull_request:
    paths: ["admin/**", "site/**", ".github/workflows/admin-ci.yml"]

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valores fictícios só para o build validar env.ts; não são segredos nem apontam para banco real.
    # O build prerenderiza `/` lendo `conteudo_versoes` no database `ci` (migrado abaixo; tabela vazia = conteúdo embutido).
    # Segredos reais ficam só na Vercel.
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-nao-e-segredo-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      # Testes de integração: o global-setup cria o database loja_test no service abaixo.
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/loja_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # fictício, só no runner efêmero
          POSTGRES_DB: ci # database do build; o global-setup dos testes usa /postgres para criar loja_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # db:migrate lê DATABASE_URL da env do job (o --env-file-if-exists não sobrescreve nem exige .env.local).
      - run: npm run db:migrate
      - run: npm run build
