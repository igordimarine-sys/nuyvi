# Painel de conteúdo (Sveltia CMS). Cada "Salvar" vira um commit no GitHub;
# a Vercel publica de novo e o build.mjs remonta o index.html a partir de conteudo/*.json.
# Este arquivo é público: não colocar segredos aqui.
backend:
  name: github
  repo: igordimarine-sys/nuyvi
  branch: painel  # voltar para main ao juntar a branch

# caminhos a partir da raiz do repositório (o site fica em site/)
media_folder: /site/img/conteudo
public_folder: /img/conteudo

collections:
  - name: paginas
    label: Site
    files:
      - name: loja
        label: Loja (produtos)
        file: site/conteudo/loja.json
        fields:
          - { name: rotulo, label: Rótulo da seção, widget: string }
          - { name: titulo1, label: Título (linha 1), widget: string }
          - { name: titulo2, label: "Título (linha 2, vazada)", widget: string }
          - name: produtos
            label: Produtos
            widget: list
            summary: "{{fields.nome}}"
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: descricao, label: Descrição, widget: text }
              - { name: foto, label: Foto, widget: image }
              - { name: alt, label: Descrição da foto (acessibilidade), widget: string, required: false }
              - { name: botao, label: Texto do botão, widget: string, default: Comprar no app }

      - name: planos
        label: Planos e preços
        file: site/conteudo/planos.json
        fields:
          - { name: desconto_anual, label: Desconto do plano anual (%), widget: number, value_type: int, min: 0, max: 90 }
          - { name: nota, label: Nota abaixo dos planos, widget: string }
          - name: planos
            label: Planos
            widget: list
            summary: "{{fields.nome}}"
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: mensal, label: Preço mensal (R$), widget: number, value_type: float, min: 0, step: 0.01 }
              - { name: texto, label: Resumo, widget: string }
              - { name: botao, label: Texto do botão, widget: string }
              - { name: capa, label: Imagem de capa, widget: image }
              - { name: selo, label: Selo (ex. Recomendado), widget: string, required: false }
              - { name: itens, label: O que inclui, widget: list, field: { name: item, label: Item, widget: string } }

      - name: explore
        label: Explore (cartões)
        file: site/conteudo/explore.json
        fields:
          - name: cartoes
            label: Cartões
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: texto, label: Texto, widget: string }
              - { name: imagem, label: Imagem, widget: image }
              - { name: posicao, label: "Enquadramento da imagem (ex. 60% 50%)", widget: string, required: false }
              - { name: inteira, label: Mostrar a imagem inteira (produto com fundo), widget: boolean, default: false }
              - name: link
                label: Leva para a seção
                widget: select
                options:
                  - { label: Vídeos, value: "#videos" }
                  - { label: Planos, value: "#premium" }
                  - { label: Bônus anual, value: "#bonus" }
                  - { label: História, value: "#historia" }
                  - { label: Explore, value: "#explore" }
                  - { label: Loja, value: "#loja" }
                  - { label: Baixar o app, value: "#baixar" }
                  - { label: Novidades, value: "#novidades" }

      - name: novidades
        label: Novidades
        file: site/conteudo/novidades.json
        fields:
          - name: noticias
            label: Notícias
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: data, label: "Data (texto livre, ex. 12 nov 2026)", widget: string }
              - { name: titulo, label: Título, widget: string }
              - { name: imagem, label: Imagem, widget: image }

      - name: textos
        label: Textos das seções
        file: site/conteudo/textos.json
        fields:
          - name: hero
            label: Abertura
            widget: object
            fields:
              - { name: frase, label: Frase, widget: string }
              - { name: plataformas, label: Linha das plataformas, widget: string }
          - name: rede
            label: Rede de parceiros (abertura)
            widget: object
            fields:
              - { name: titulo1, label: Título (destaque), widget: string }
              - { name: titulo2, label: Título (continuação), widget: string }
              - { name: texto, label: Texto, widget: text }
          - name: bonus
            label: Bônus do plano anual
            widget: object
            fields:
              - { name: rotulo, label: Rótulo, widget: string }
              - { name: titulo1, label: Título (linha 1), widget: string }
              - { name: titulo2, label: Título (linha 2), widget: string }
              - { name: texto, label: Texto, widget: text }
              - { name: itens, label: Vantagens, widget: list, field: { name: item, label: Vantagem, widget: string } }
          - name: historia
            label: História
            widget: object
            fields:
              - { name: rotulo, label: Rótulo, widget: string }
              - { name: titulo1, label: Título (linha 1), widget: string }
              - { name: titulo2, label: Título (linha 2), widget: string }
              - { name: texto, label: Texto, widget: text }
          - name: baixar
            label: Baixe o app
            widget: object
            fields:
              - { name: rotulo, label: Rótulo, widget: string }
              - { name: titulo1, label: Título (linha 1), widget: string }
              - { name: titulo2, label: Título (linha 2), widget: string }
              - { name: texto, label: Texto, widget: text }
